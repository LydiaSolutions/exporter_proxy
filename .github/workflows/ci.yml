name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test ./...

      - name: Build exporter proxy
        run: go build -o "$RUNNER_TEMP/exporter_proxy" .

      - name: Run integration smoke check
        run: bash .github/scripts/smoke-test.sh "$RUNNER_TEMP/exporter_proxy"
